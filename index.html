<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proje Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#122536">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#F3F5F8;
  --panel:#FFFFFF;
  --ink:#101F2E;
  --ink-soft:#64798C;
  --line:#E4E9EE;
  --navy:#122536;
  --navy-2:#1B3348;
  --amber:#EF9F35;
  --amber-ink:#5A3B0C;
  --green:#2E9E6D;
  --red:#D64545;
  --blue:#3A7CA5;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(16,31,46,.05), 0 1px 1px rgba(16,31,46,.04);
  --shadow-md:0 4px 14px rgba(16,31,46,.08);
  --badge-devam-bg:#FCEAD2;
  --badge-devam-ink:#8A5A12;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif; margin:0; font-weight:700; letter-spacing:-0.01em;}
button{font-family:inherit;}
a{color:inherit;}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:70px;}

/* ---------- Header ---------- */
.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky; top:0; z-index:20;
  box-shadow:0 2px 10px rgba(9,20,31,.18);
}
.topbar img.logo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff2;}
.topbar .logo-fallback{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.topbar .co-name{font-weight:700;font-size:16px;flex:1;}
.topbar .co-sub{font-size:11px;opacity:.65;font-weight:500;}
.topbar button.icon-btn{background:none;border:none;color:#fff;opacity:.85;padding:6px;cursor:pointer;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  max-width:560px;margin:0 auto;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:30;
}
.bottomnav button{
  flex:1;background:none;border:none;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-soft);cursor:pointer;font-size:11px;font-weight:600;
}
.bottomnav button.active{color:var(--navy);}
.bottomnav svg{width:20px;height:20px;}

/* ---------- Generic layout ---------- */
.screen{padding:16px;flex:1;}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.stats-row{display:flex;gap:10px;margin-bottom:4px;}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-sm);}
.stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;line-height:1;}
.stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:600;}
.stat.warn .num{color:var(--red);}

.search-row{display:flex;gap:8px;margin:16px 0;}
.search-row input{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:10px 12px;font-size:14px;color:var(--ink);}
.fab{
  width:40px;height:40px;border-radius:10px;border:none;background:var(--navy);color:#fff;
  font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}

/* ---------- Project card ---------- */
.project-card{
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);
  border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:10px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:box-shadow .15s ease, transform .15s ease;
}
.project-card:active{box-shadow:var(--shadow-sm);transform:scale(.99);}
.project-card.status-devam{border-left-color:var(--amber);}
.project-card.status-bitti{border-left-color:var(--green);}
.project-card.status-iptal{border-left-color:var(--red);}
.project-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.project-card .title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;}
.badge.devam{background:var(--badge-devam-bg);color:var(--badge-devam-ink);}
.badge.bitti{background:#E6F5EE;color:var(--green);}
.badge.iptal{background:#FBEAEA;color:var(--red);}
.project-card .dept{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.project-card .next-deadline{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:600;display:flex;align-items:center;gap:4px;}
.project-card .next-deadline.overdue{color:var(--red);font-weight:700;}
.progress-bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--amber);}
.project-card .meta-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:6px;font-weight:600;}

.hideclosed-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:-2px 0 10px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.hideclosed-row input{accent-color:var(--navy);}

.overdue-banner{background:#FBEAEA;color:var(--red);border:1px solid #F3C6C6;border-radius:var(--radius);padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* ---------- Mini weekly chart ---------- */
.mini-chart{display:flex;align-items:flex-end;gap:6px;height:64px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 8px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.mini-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.mini-chart .bar{width:100%;max-width:20px;background:var(--amber);border-radius:4px 4px 0 0;min-height:2px;}
.mini-chart .bar-lbl{font-size:9.5px;color:var(--ink-soft);font-weight:700;}

.empty{
  text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:14px;
}
.empty svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}
.empty b{display:block;color:var(--ink);font-family:'Fraunces',serif;font-size:18px;margin-bottom:6px;font-weight:700;}

/* ---------- Project detail ---------- */
.detail-header{margin-bottom:14px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.back-row button{background:none;border:none;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;}
.detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.detail-title-row h1{font-size:22px;}
.status-select{border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;background:var(--panel);}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:10px;padding:3px;margin:14px 0;}
.tabs button{flex:1;border:none;background:none;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.tabs button.active{background:var(--panel);color:var(--navy);}

.task-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow-sm);}
.task-card.selectable{display:flex;gap:10px;align-items:flex-start;}
.task-card.selectable input[type=checkbox]{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex-shrink:0;}
.task-card .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.task-card .name{font-weight:700;font-size:14.5px;}
.prio{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.02em;}
.prio.acil{background:#FBEAEA;color:var(--red);}
.prio.normal{background:#FFF3E0;color:#9A6A15;}
.prio.dusuk{background:#EEF2F4;color:var(--ink-soft);}
.task-card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:6px;}
.avatar-xs{width:18px;height:18px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;object-fit:cover;}
.task-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.task-card .deadline.overdue{color:var(--red);font-weight:800;}
.tag-chip{display:inline-block;background:var(--line);color:var(--ink-soft);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-right:4px;}
.tag-chip.filterable{cursor:pointer;margin-bottom:6px;}
.tag-chip.filterable.active{background:var(--navy);color:#fff;}
.filter-row{margin:12px 0 4px;}
.bulk-toolbar{position:sticky;bottom:70px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:8px;margin:10px 0;box-shadow:var(--shadow-md);flex-wrap:wrap;}
.bulk-toolbar span{font-size:12px;font-weight:700;margin-right:auto;}
.bulk-toolbar button{border:none;background:#ffffff1c;color:#fff;border-radius:7px;padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer;}
.bulk-toolbar button.cancel{background:none;opacity:.7;}

/* ---------- Kanban ---------- */
.kanban-cols{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 8px;}
.kanban-col{min-width:78%;background:#EDF1F4;border-radius:var(--radius);padding:10px;flex-shrink:0;}
.kanban-col h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;font-weight:800;}
.kanban-card{background:var(--panel);border-radius:8px;border-left:3px solid var(--line);padding:10px;margin-bottom:8px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(15,35,51,.06);cursor:pointer;}
.kanban-card.acil{border-left-color:var(--red);}
.kanban-card.dusuk{border-left-color:var(--ink-soft);}
.kanban-card .kc-sub{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10.5px;color:var(--ink-soft);font-weight:600;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-head button{background:none;border:none;font-size:18px;color:var(--navy);cursor:pointer;padding:4px 10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:10px;text-align:center;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
.cal-day{aspect-ratio:1;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;padding:4px;position:relative;cursor:pointer;}
.cal-day.empty{background:transparent;border:none;}
.cal-day.today{border-color:var(--navy);border-width:2px;}
.cal-day .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--amber);}
.cal-day .dot.overdue{background:var(--red);}
.cal-list-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
.cal-list-item .pname{font-weight:700;font-size:11px;color:var(--ink-soft);}

/* ---------- Forms / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,35,51,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:slideup .18s ease-out;}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet h2{font-size:19px;margin-bottom:14px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:14px;
  font-family:inherit;color:var(--ink);background:#FBFCFD;
}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.btn{border:none;border-radius:9px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;width:100%;}
.btn.primary{background:var(--navy);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.btn.ghost{background:none;color:var(--navy-2);border:1px solid var(--line);}
.btn-row{display:flex;gap:8px;margin-top:16px;}
.btn-row .btn{flex:1;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}

/* ---------- Task detail ---------- */
.task-detail-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);font-weight:600;}
.kv .v{font-weight:600;text-align:right;}
.timeline-item{display:flex;gap:10px;margin-bottom:12px;}
.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0;}
.timeline-item .tbody{flex:1;}
.timeline-item .tdate{font-size:10.5px;color:var(--ink-soft);font-weight:700;}
.timeline-item .tstep{font-size:13.5px;margin-top:1px;}
.timeline-item .tperson{font-size:11px;color:var(--ink-soft);margin-top:2px;font-style:italic;}
.comment-item{background:#FBFCFD;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
.comment-item .cwho{font-weight:700;font-size:11.5px;margin-bottom:2px;}
.attach-item{display:flex;align-items:center;justify-content:space-between;background:#FBFCFD;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;}
.attach-item a{color:var(--blue);font-weight:700;text-decoration:none;}

/* ---------- Profile ---------- */
.avatar-lg{width:74px;height:74px;border-radius:50%;object-fit:cover;background:var(--line);}
.avatar-fallback{width:74px;height:74px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;}
.file-btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--navy-2);}
.file-btn input{display:none;}
.team-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.team-row .av{width:32px;height:32px;border-radius:50%;background:var(--line);object-fit:cover;}
.team-row .av-fb{width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.team-row .nm{flex:1;font-weight:600;font-size:13.5px;}
.pill-toggle{display:flex;background:var(--line);border-radius:20px;padding:3px;}
.pill-toggle button{flex:1;border:none;background:none;padding:7px 0;border-radius:16px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.pill-toggle button.active{background:var(--panel);color:var(--navy);}

/* ---------- Onboarding ---------- */
.onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;background:var(--navy);color:#fff;}
.onboard h1{color:#fff;font-size:26px;margin-bottom:6px;}
.onboard p{color:#C9D6E0;font-size:14px;margin-bottom:24px;}
.onboard .who-btn{display:flex;align-items:center;gap:12px;background:#ffffff12;border:1px solid #ffffff26;border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:#fff;font-weight:600;}
.onboard .who-btn .av-fb{width:36px;height:36px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-weight:800;}
.onboard input{width:100%;border:none;border-radius:9px;padding:12px;font-size:14px;margin-bottom:10px;}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:-6px;margin-bottom:12px;}
.config-warning{background:#FFF3E0;border:1px solid #F0C989;color:#7A4E0B;padding:14px;border-radius:10px;font-size:13px;margin:16px;}
.config-warning code{background:#00000010;padding:1px 5px;border-radius:4px;font-size:11.5px;}

/* ---------- Chat ---------- */
.chat-list{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.chat-bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4;}
.chat-row{display:flex;flex-direction:column;}
.chat-row.mine{align-items:flex-end;}
.chat-row.theirs{align-items:flex-start;}
.chat-row .who{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin:0 4px 3px;}
.chat-row.mine .chat-bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
.chat-row.theirs .chat-bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;}
.chat-inputbar{position:sticky;bottom:70px;display:flex;gap:8px;background:var(--bg);padding-top:8px;}
.chat-inputbar input{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:10px 14px;font-size:14px;color:var(--ink);}
.chat-inputbar button{width:40px;height:40px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;}
</style>
</head>

        <code>FIREBASE_CONFIG</code> alanını kendi Firebase bilgilerinle doldurup
        dosyayı tekrar GitHub'a yükle. Adımlar dosyanın içinde yorum olarak yazılı.

}

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

/* ---------------- State ---------------- */
let state = {
  route: {name:'home'},
  company: {name:'Şirketim', logo:null},
  team: [],
  projects: [],
  tasksByProject: {},   // pid -> [tasks]
  currentUserId: localStorage.getItem('pt_user_id') || null,
  taskExtra: {progress:[], comments:[]}, // for open task
  filter: '',
  projectFilter: {pid:null, scope:'all', tag:''},
  calMonth: (function(){const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()};})(),
  hideClosed: localStorage.getItem('pt_hide_closed')==='1',
  selectMode: false,
  selectedTasks: new Set(),
  messages: []
};
let unsubs = {task:null, chat:null};

function currentUser(){
  return state.team.find(t=>t.id===state.currentUserId) || null;
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function fmtDate(d){
  if(!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isOverdue(deadline, column){
  if(!deadline || column==='bitti') return false;
  return deadline < todayISO();
}
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Firestore listeners ---------------- */
db.collection('meta').doc('company').onSnapshot(doc=>{
  if(doc.exists) state.company = Object.assign({name:'Şirketim',logo:null}, doc.data());
  render();
});

db.collection('team').onSnapshot(snap=>{
  state.team = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
  render();
});

db.collection('projects').orderBy('createdAt','desc').onSnapshot(snap=>{
  state.projects = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
  render();
}, err=>console.error('projects listen error', err));

db.collectionGroup('tasks').onSnapshot(snap=>{
  const byProj = {};
  snap.docs.forEach(d=>{
    const pid = d.ref.parent.parent.id;
    if(!byProj[pid]) byProj[pid]=[];
    byProj[pid].push(Object.assign({id:d.id, pid}, d.data()));
  });
  state.tasksByProject = byProj;
  render();
}, err=>console.error('tasks listen error', err));

/* ---------------- Data ops ---------------- */
function addProject(title, department){
  return db.collection('projects').add({
    title, department: department||'', status:'devam',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: currentUser() ? currentUser().name : ''
  });
}
function setProjectStatus(pid, status){
  return db.collection('projects').doc(pid).update({status});
}
async function deleteProject(pid){
  const tasks = state.tasksByProject[pid] || [];
  for(const t of tasks){ await deleteTask(pid, t.id); }
  await db.collection('projects').doc(pid).delete();
}
function addTask(pid, data){
  return db.collection('projects').doc(pid).collection('tasks').add(Object.assign({
    column:'yapilacak',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    createdBy: currentUser() ? currentUser().name : ''
  }, data));
}
function updateTask(pid, tid, fields){
  return db.collection('projects').doc(pid).collection('tasks').doc(tid).update(fields);
}
async function deleteTask(pid, tid){
  const ref = db.collection('projects').doc(pid).collection('tasks').doc(tid);
  const progSnap = await ref.collection('progress').get();
  for(const d of progSnap.docs) await d.ref.delete();
  const comSnap = await ref.collection('comments').get();
  for(const d of comSnap.docs) await d.ref.delete();
  await ref.delete();
}
function addProgress(pid, tid, step){
  return db.collection('projects').doc(pid).collection('tasks').doc(tid).collection('progress').add({
    date: todayISO(), step, person: currentUser()?currentUser().name:'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function addComment(pid, tid, text){
  return db.collection('projects').doc(pid).collection('tasks').doc(tid).collection('comments').add({
    text, person: currentUser()?currentUser().name:'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function saveCompany(fields){
  return db.collection('meta').doc('company').set(fields, {merge:true});
}
function addTeamMember(name, photo){
  return db.collection('team').add({name, photo: photo||null});
}
function updateTeamMember(id, fields){
  return db.collection('team').doc(id).update(fields);
}
function sendMessage(text){
  return db.collection('messages').add({
    text, person: currentUser()?currentUser().name:'', personId: state.currentUserId||'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function listenMessages(){
  if(unsubs.chat) return;
  unsubs.chat = db.collection('messages').orderBy('createdAt','asc').limitToLast(200).onSnapshot(snap=>{
    state.messages = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(state.route.name==='chat') paintChat();
  }, err=>console.error('messages listen error', err));
}

/* ---------------- File to base64 helper ---------------- */
function fileToDataUrl(file, maxBytes){
  return new Promise((resolve,reject)=>{
    if(file.size > maxBytes){ reject(new Error('Dosya çok büyük (limit '+Math.round(maxBytes/1024)+' KB)')); return; }
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

function go(route){ state.route = route; window.scrollTo(0,0); render(); }

/* ================= RENDER: HOME ================= */
function projectStats(pid){
  const tasks = state.tasksByProject[pid] || [];
  const total = tasks.length;
  const done = tasks.filter(t=>t.column==='bitti').length;
  const overdue = tasks.filter(t=>isOverdue(t.deadline, t.column)).length;
  const pct = total ? Math.round(done/total*100) : 0;
  return {total, done, overdue, pct};
}
function nextDeadline(pid){
  const tasks = (state.tasksByProject[pid]||[]).filter(t=>t.deadline && t.column!=='bitti');
  if(!tasks.length) return null;
  tasks.sort((a,b)=>a.deadline.localeCompare(b.deadline));
  return tasks[0];
}
function weeklyCompletionData(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const counts = Object.fromEntries(days.map(d=>[d,0]));
  Object.values(state.tasksByProject).forEach(list=>{
    list.forEach(t=>{
      if(t.completedAt && counts.hasOwnProperty(t.completedAt)) counts[t.completedAt]++;
    });
  });
  const dow = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
  return days.map(d=>({ label: dow[new Date(d+'T00:00:00').getDay()], count: counts[d] }));
}

function renderHome(){
  const q = state.filter.trim().toLowerCase();
  let projects = state.projects;
  let matchedTaskInfo = {}; // pid -> matched task count if searching
  if(q){
    projects = projects.filter(p=>{
      const titleMatch = (p.title||'').toLowerCase().includes(q) || (p.department||'').toLowerCase().includes(q);
      const tasks = state.tasksByProject[p.id] || [];
      const taskMatch = tasks.some(t=>
        (t.name||'').toLowerCase().includes(q) ||
        (t.assignedTo||'').toLowerCase().includes(q) ||
        (t.givenBy||'').toLowerCase().includes(q) ||
        (t.tags||[]).some(tag=>tag.toLowerCase().includes(q))
      );
      return titleMatch || taskMatch;
    });
  }

  if(state.hideClosed){
    projects = projects.filter(p=>p.status==='devam');
  }

  let totalActiveTasks=0, totalOverdue=0;
  state.projects.forEach(p=>{
    const s = projectStats(p.id);
    totalActiveTasks += (s.total - s.done);
    totalOverdue += s.overdue;
  });
  const totalProjects = state.projects.length;

  const cards = projects.map(p=>{
    const s = projectStats(p.id);
    const nd = nextDeadline(p.id);
    const ndOverdue = nd ? isOverdue(nd.deadline, nd.column) : false;
    return `
      <div class="project-card status-${p.status}" data-open-project="${p.id}">
        <div class="row1">
          <div class="title">${escapeHtml(p.title)}</div>
          <span class="badge ${p.status}">${p.status==='devam'?'Devam':p.status==='bitti'?'Bitti':'İptal'}</span>
        </div>
        ${p.department ? `<div class="dept">${escapeHtml(p.department)}</div>` : ''}
        ${nd ? `<div class="next-deadline ${ndOverdue?'overdue':''}">${ndOverdue?'⚠ Gecikti':'📅 En yakın'}: ${escapeHtml(nd.name)} — ${fmtDate(nd.deadline)}</div>` : ''}
        <div class="progress-bar"><div style="width:${s.pct}%"></div></div>
        <div class="meta-row">
          <span>${s.done}/${s.total} iş tamamlandı</span>
          ${s.overdue>0 ? `<span style="color:var(--red);font-weight:800">${s.overdue} gecikmiş</span>` : `<span>${s.pct}%</span>`}
        </div>
      </div>`;
  }).join('');

  const chart = weeklyCompletionData();
  const maxCount = Math.max(1, ...chart.map(c=>c.count));

  const html = `
    <div class="section-title">Genel Durum</div>
    ${totalOverdue>0 ? `<div class="overdue-banner">⚠ ${totalOverdue} iş gecikti — ilgili projelere göz at.</div>` : ''}
    <div class="stats-row">
      <div class="stat"><div class="num">${totalProjects}</div><div class="lbl">Toplam proje</div></div>
      <div class="stat"><div class="num">${totalActiveTasks}</div><div class="lbl">Aktif iş</div></div>
      <div class="stat ${totalOverdue>0?'warn':''}"><div class="num">${totalOverdue}</div><div class="lbl">Geciken iş</div></div>
    </div>
    <div class="mini-chart">
      ${chart.map(c=>`<div class="bar-col"><div class="bar" style="height:${Math.max(4, c.count/maxCount*100)}%"></div><div class="bar-lbl">${c.label}</div></div>`).join('')}
    </div>
    <div class="search-row">
      <input id="searchInput" placeholder="Proje, iş, kişi veya etiket ara…" value="${escapeHtml(state.filter)}">
      <button class="fab" id="newProjectBtn">+</button>
    </div>
    <div class="hideclosed-row"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="hideClosedChk" ${state.hideClosed?'checked':''}> Kapalı/İptal projeleri gizle</label></div>
    <button class="btn ghost" id="excelExportBtn" style="margin-bottom:16px">📊 Tüm Projeler İçin Excel Raporu</button>
    ${cards || `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><b>Henüz proje yok</b>Yeni bir proje açmak için + butonuna dokun.</div>`}
  `;
  app.innerHTML = renderChrome(html, 'home');
  wireChrome();
  document.getElementById('searchInput').addEventListener('input', e=>{ state.filter = e.target.value; render(); });
  document.getElementById('newProjectBtn').addEventListener('click', openNewProjectSheet);
  document.getElementById('excelExportBtn').addEventListener('click', exportAllProjectsExcel);
  document.getElementById('hideClosedChk').addEventListener('change', e=>{
    state.hideClosed = e.target.checked;
    localStorage.setItem('pt_hide_closed', state.hideClosed ? '1':'0');
    render();
  });
  app.querySelectorAll('[data-open-project]').forEach(el=>{
    el.addEventListener('click', ()=> go({name:'project', pid: el.dataset.openProject, tab:'liste'}));
  });
}

    b.addEventListener('click', async ()=>{

      if(b.dataset.col==='bitti'){

function createRecurringCopy(pid, t){
  const days = t.recurrence==='weekly' ? 7 : t.recurrence==='monthly' ? 30 : 0;
  let newDeadline = null;
  if(t.deadline && days){
    const d = new Date(t.deadline+'T00:00:00');
    d.setDate(d.getDate()+days);
    newDeadline = d.toISOString().slice(0,10);
  }
  return addTask(pid, {
    name: t.name, givenBy: t.givenBy||'', assignedTo: t.assignedTo||'',
    description: t.description||'', priority: t.priority||'normal',
    deadline: newDeadline, tags: t.tags||[], notes: t.notes||'',
    recurrence: t.recurrence||'none'
  });
}

/* ================= RENDER: CALENDAR ================= */
function renderCalendar(){
  const {y,m} = state.calMonth;
  const first = new Date(y,m,1);
  const startDow = first.getDay(); // 0=Sun
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  // gather all tasks with deadlines in this month
  const allTasks = [];
  Object.keys(state.tasksByProject).forEach(pid=>{
    const proj = state.projects.find(p=>p.id===pid);
    (state.tasksByProject[pid]||[]).forEach(t=>{
      if(t.deadline) allTasks.push(Object.assign({}, t, {projectTitle: proj?proj.title:''}));
    });
  });
  const byDate = {};
  allTasks.forEach(t=>{ (byDate[t.deadline] = byDate[t.deadline]||[]).push(t); });

  const todayStr = todayISO();
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = byDate[dateStr] || [];
    const hasOverdue = dayTasks.some(t=>isOverdue(t.deadline, t.column));
    cells += `<div class="cal-day ${dateStr===todayStr?'today':''}" data-day="${dateStr}">
      ${d}${dayTasks.length ? `<div class="dot ${hasOverdue?'overdue':''}"></div>` : ''}
    </div>`;
  }
  const dow = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];

  const upcoming = allTasks.filter(t=>t.deadline >= todayStr && t.column!=='bitti')
    .sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,8);

  const html = `
    <div class="section-title">Takvim</div>
    <div class="cal-head">
      <button id="prevMonth">‹</button>
      <b>${monthNames[m]} ${y}</b>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
      ${cells}
    </div>
    <div class="section-title">Yaklaşan İşler</div>
    ${upcoming.length ? upcoming.map(t=>`
      <div class="cal-list-item">
        <div class="pname">${escapeHtml(t.projectTitle)} · ${fmtDate(t.deadline)}${isOverdue(t.deadline,t.column)?' · ⚠ gecikmiş':''}</div>
        ${escapeHtml(t.name)} — ${escapeHtml(t.assignedTo||'—')}
      </div>`).join('') : `<div class="hint">Yaklaşan iş yok.</div>`}
  `;
  app.innerHTML = renderChrome(html, 'calendar');
  wireChrome();
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    state.calMonth.m--; if(state.calMonth.m<0){state.calMonth.m=11; state.calMonth.y--;}
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    state.calMonth.m++; if(state.calMonth.m>11){state.calMonth.m=0; state.calMonth.y++;}
    render();
  });
}

      <button data-theme="auto" class="${(localStorage.getItem('pt_theme')||'light')==='auto'?'active':''}">Otomatik</button>
    </div>
    <p class="hint" style="margin-top:8px">Bu cihaza özeldir, diğer kişileri etkilemez.</p>
  `;
  app.innerHTML = renderChrome(html, 'profile');
  wireChrome();

  document.getElementById('saveMeBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('myName').value.trim();
    if(!name){ showToast('İsim boş olamaz'); return; }
    if(state.currentUserId){
      await updateTeamMember(state.currentUserId, {name});
    } else {
      const ref = await addTeamMember(name, null);
      state.currentUserId = ref.id;
      localStorage.setItem('pt_user_id', ref.id);
    }
    showToast('Profil kaydedildi');
  });
  document.getElementById('myPhotoInput').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const dataUrl = await fileToDataUrl(file, 300*1024);
      if(state.currentUserId) await updateTeamMember(state.currentUserId, {photo:dataUrl});
      showToast('Fotoğraf güncellendi');
    }catch(err){ showToast(err.message); }
  });
  document.getElementById('saveCoBtn').addEventListener('click', async ()=>{
    await saveCompany({name: document.getElementById('companyName').value.trim()});
    showToast('Şirket bilgisi kaydedildi');
  });
  document.getElementById('logoInput').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const dataUrl = await fileToDataUrl(file, 300*1024);
      await saveCompany({logo:dataUrl});
      showToast('Logo güncellendi');
    }catch(err){ showToast(err.message); }
  });
  app.querySelectorAll('[data-theme]').forEach(b=>{
    b.addEventListener('click', ()=>{
      localStorage.setItem('pt_theme', b.dataset.theme);
      applyTheme();
      render();
    });
  });
}

/* ================= THEME ================= */
function applyTheme(){
  const stored = localStorage.getItem('pt_theme') || 'light';
  const t = stored==='auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : stored;
  if(t==='dark'){
    document.documentElement.style.setProperty('--bg','#0F1C26');
    document.documentElement.style.setProperty('--panel','#16283A');
    document.documentElement.style.setProperty('--ink','#EAF1F6');
    document.documentElement.style.setProperty('--ink-soft','#8FA6B8');
    document.documentElement.style.setProperty('--line','#25405A');
  } else {
    document.documentElement.style.setProperty('--bg','#F4F6F8');
    document.documentElement.style.setProperty('--panel','#FFFFFF');
    document.documentElement.style.setProperty('--ink','#0F2333');
    document.documentElement.style.setProperty('--ink-soft','#5C7080');
    document.documentElement.style.setProperty('--line','#E1E7EC');
  }
}

/* ================= PDF EXPORT (Turkish-safe font) ================= */
let fontRegistered = false;
function ensureTurkishFont(doc){
  if(!fontRegistered){
    doc.addFileToVFS('DejaVuSans.ttf', window.__PT_FONT_B64__);
    doc.addFont('DejaVuSans.ttf', 'DejaVuSans', 'normal');
    fontRegistered = true;
  }
  doc.setFont('DejaVuSans','normal');
}
function exportProjectPdf(project, tasks){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  ensureTurkishFont(doc);
  let y = 18;
  doc.setFontSize(18);
  doc.text(project.title || 'Proje', 14, y); y+=8;
  doc.setFontSize(10);
  doc.text('Departman: ' + (project.department||'—') + '   Durum: ' + (project.status||'—'), 14, y); y+=6;
  doc.text('Rapor tarihi: ' + fmtDate(new Date()), 14, y); y+=10;

  tasks.forEach((t, idx)=>{
    if(y > 265){ doc.addPage(); ensureTurkishFont(doc); y = 18; }
    doc.setFontSize(12);
    doc.text((idx+1)+'. '+ (t.name||''), 14, y); y+=6;
    doc.setFontSize(9.5);
    const lines = [
      'İşi veren: ' + (t.givenBy||'—') + '   İşi yüklenen: ' + (t.assignedTo||'—'),
      'Öncelik: ' + (t.priority||'normal') + '   Son tarih: ' + (t.deadline?fmtDate(t.deadline):'—') + '   Durum: ' + (t.column||'yapilacak'),
    ];
    if(t.description) lines.push('Tanım: ' + t.description);
    if(t.notes) lines.push('Açıklama: ' + t.notes);
    lines.forEach(l=>{
      const wrapped = doc.splitTextToSize(l, 180);
      wrapped.forEach(w=>{
        if(y > 275){ doc.addPage(); ensureTurkishFont(doc); y = 18; }
        doc.text(w, 16, y); y+=5.2;
      });
    });
    y += 3;
  });

  doc.save((project.title||'proje').replace(/[^\wşğüöçİıŞĞÜÖÇ ]/g,'').trim() + '.pdf');
}

/* ================= EXCEL EXPORT (tüm projeler) ================= */
function exportAllProjectsExcel(){
  if(!state.projects.length){ showToast('Rapor için önce proje ekle'); return; }
  const projectRows = state.projects.map(p=>{
    const s = projectStats(p.id);
    return {
      'Proje Adı': p.title || '',
      'Departman': p.department || '',
      'Durum': p.status==='devam' ? 'Devam' : p.status==='bitti' ? 'Bitti' : 'İptal',
      'Toplam İş': s.total,
      'Tamamlanan': s.done,
      'Gecikmiş': s.overdue,
      'İlerleme %': s.pct
    };
  });
  const taskRows = [];
  state.projects.forEach(p=>{
    (state.tasksByProject[p.id] || []).forEach(t=>{
      taskRows.push({
        'Proje': p.title || '',
        'İş Adı': t.name || '',
        'İşi Veren': t.givenBy || '',
        'İşi Yüklenen': t.assignedTo || '',
        'Öncelik': t.priority==='acil' ? 'Acil' : t.priority==='dusuk' ? 'Düşük' : 'Normal',
        'Durum': t.column==='bitti' ? 'Bitti' : t.column==='devam' ? 'Devam Ediyor' : 'Yapılacak',
        'Son Tarih': t.deadline ? fmtDate(t.deadline) : '',
        'Gecikti mi': isOverdue(t.deadline, t.column) ? 'Evet' : 'Hayır',
        'Etiketler': (t.tags || []).join(', '),
        'Açıklama': t.description || ''
      });
    });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projectRows), 'Projeler');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taskRows.length ? taskRows : [{'Not':'Henüz iş yok'}]), 'İşler');
  XLSX.writeFile(wb, 'tum-projeler-raporu.xlsx');
}

/* ================= CHAT ================= */
function renderChat(){
  listenMessages();
  const html = `
    <div class="section-title">Ekip Sohbeti</div>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-inputbar">
      <input id="chatInput" placeholder="Bir mesaj yaz…" maxlength="1000">
      <button id="chatSendBtn">➤</button>
    </div>
  `;
  app.innerHTML = renderChrome(html, 'chat');
  wireChrome();
  paintChat();
  const input = document.getElementById('chatInput');
  const send = ()=>{
    const val = input.value.trim();
    if(!val) return;
    input.value='';
    sendMessage(val).catch(()=>showToast('Mesaj gönderilemedi'));
  };
  document.getElementById('chatSendBtn').addEventListener('click', send);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}
function paintChat(){
  const list = document.getElementById('chatList');
  if(!list) return;
  const me = currentUser();
  if(!state.messages.length){
    list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><b>Henüz mesaj yok</b>Ekiple ilk mesajı sen gönder.</div>`;
    return;
  }
  list.innerHTML = state.messages.map(m=>{
    const mine = me && m.personId === me.id;
    return `<div class="chat-row ${mine?'mine':'theirs'}">
      ${!mine ? `<div class="who">${escapeHtml(m.person||'—')}</div>` : ''}
      <div class="chat-bubble">${escapeHtml(m.text)}</div>
    </div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

/* ================= MAIN RENDER DISPATCH ================= */
function render(){
  applyTheme();
  if(!state.currentUserId || !currentUser()){
    renderOnboarding();
    return;
  }
  if(unsubs.task && state.route.name!=='task') { /* keep listener alive only on task screen */ }
  switch(state.route.name){
    case 'home': renderHome(); break;
    case 'project': renderProject(state.route.pid, state.route.tab||'liste'); break;
    case 'task': renderTask(state.route.pid, state.route.tid); break;
    case 'calendar': renderCalendar(); break;
    case 'chat': renderChat(); break;
    case 'profile': renderProfile(); break;
    default: renderHome();
  }
}

applyTheme();
render();

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if((localStorage.getItem('pt_theme')||'light')==='auto') applyTheme();
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

})();
